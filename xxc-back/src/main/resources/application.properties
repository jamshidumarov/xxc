spring.application.name=xxc-back
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/xxc}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — update: mavjud jadvallarni yangilaydi, yo'q bo'lsa yaratadi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway o'chirildi — jadvallar Hibernate orqali boshqariladi
spring.flyway.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET:xxceramics-super-secret-key-at-least-256-bits-long-for-hs256}
app.jwt.access-token-expiry=${JWT_ACCESS_EXPIRY:3600000}
app.jwt.refresh-token-expiry=${JWT_REFRESH_EXPIRY:604800000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB
